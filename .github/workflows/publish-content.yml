name: Publish Content

on:
  workflow_dispatch:
    inputs:
      rebuildId:
        description: "Content rebuild UUID from MindAI backend"
        required: true
        type: string
      applicationId:
        description: "Fluxo application UUID (must match secret)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish:
    permissions:
      contents: write
    uses: Mark-goga/landing-kit/.github/workflows/publish-content.yml@main
    with:
      rebuildId: ${{ inputs.rebuildId }}
      applicationId: ${{ inputs.applicationId }}
      managedContentRoot: src/content/blog/generated
    secrets:
      APPLICATION_ID: ${{ secrets.APPLICATION_ID }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      PUBLISHING_API_KEY: ${{ secrets.PUBLISHING_API_KEY }}
